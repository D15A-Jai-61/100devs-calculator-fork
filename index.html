<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Simple OOP Calculator - #100Devs</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<figure class="reference" aria-hidden="true">
<img src="calculator.jpg" alt="reference calculator" class="ref-img">
<figcaption class="small">Reference layout</figcaption>
</figure>


<main class="calculator" role="application" aria-label="Simple calculator">
<div class="display" id="display" aria-live="polite">0</div>


<div class="keys" role="group" aria-label="Calculator buttons">
<button class="func" data-action="clear" aria-label="All clear">AC</button>
<button class="func" data-action="delete" aria-label="Delete">DEL</button>
<button class="func" data-action="percent" aria-label="Percent">%</button>
<button class="op" data-operation="/" aria-label="divide">÷</button>


<button class="num" data-number="7">7</button>
<button class="num" data-number="8">8</button>
<button class="num" data-number="9">9</button>
<button class="op" data-operation="*" aria-label="multiply">×</button>


<button class="num" data-number="4">4</button>
<button class="num" data-number="5">5</button>
<button class="num" data-number="6">6</button>
<button class="op" data-operation="-" aria-label="subtract">−</button>


<button class="num" data-number="1">1</button>
<button class="num" data-number="2">2</button>
<button class="num" data-number="3">3</button>
<button class="op" data-operation="+" aria-label="add">+</button>


<button class="num zero" data-number="0">0</button>
<button class="num" data-number=".">.</button>
<button class="equals" data-action="equals" aria-label="equals">=</button>
</div>
</main>
</div>


<script src="script.js"></script>
</body>
</html>
